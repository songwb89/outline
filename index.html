<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>兆涵科技 - 智能教学管理系统</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://registry.npmmirror.com/lucide/latest/files/dist/umd/lucide.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .card-hover {
      transition: all 0.3s ease;
    }
    
    .card-hover:hover {
      transform: translateY(-8px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }
    
    .icon-float {
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .pulse-ring {
      animation: pulse-ring 2s ease-out infinite;
    }
    
    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50">
  <!-- 顶部 Logo -->
  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-4">
      <div class="flex items-center gap-3">
        <div class="flex flex-col leading-tight">
          <span class="text-lg font-bold text-gray-800">兆涵科技</span>
          <span class="text-xs text-gray-500">Sigma Education</span>
        </div>
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="max-w-5xl mx-auto px-6 py-16">
    <!-- 入口卡片 -->
    <div class="max-w-2xl mx-auto">
      <!-- 教师端入口 -->
      <div class="card-hover bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-100">
        <div class="gradient-bg p-8 text-center text-white">
          <div class="relative inline-block mb-4">
            <div class="w-20 h-20 bg-white/20 rounded-2xl flex items-center justify-center mx-auto">
              <i data-lucide="graduation-cap" class="w-10 h-10"></i>
            </div>
            <div class="absolute inset-0 bg-white/20 rounded-2xl pulse-ring"></div>
          </div>
          <h2 class="text-2xl font-bold mb-2">教师端</h2>
          <p class="text-white/80 text-sm">课堂分析</p>
        </div>
        <div class="p-6">
          <div class="flex flex-wrap items-center justify-end gap-3">
            <a href="pages/evaluate.html" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 rounded-xl border border-blue-200 px-4 py-2 text-sm font-medium text-blue-600 transition hover:border-blue-300 hover:bg-blue-50">
              <span>课堂分析</span>
              <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
            </a>
            <a href="pages/login.html" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 rounded-xl border border-blue-200 px-4 py-2 text-sm font-medium text-blue-600 transition hover:border-blue-300 hover:bg-blue-50">
              <span>登录页</span>
              <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
            </a>
            <button type="button" onclick="openOptimizeRequirement()" class="inline-flex items-center gap-2 rounded-xl border border-blue-200 px-4 py-2 text-sm font-medium text-blue-600 transition hover:border-blue-300 hover:bg-blue-50">
              <span>优化需求</span>
              <i data-lucide="panel-right-open" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部信息 -->
    <div class="text-center mt-16 text-gray-400 text-sm">
      <p>兆涵科技 © 2026 Sigma Education</p>
    </div>
  </main>

  <script src="components/prd-drawer.js"></script>
  <script>
    async function openOptimizeRequirement() {
      if (!window.prdDrawer || typeof window.prdDrawer.openDocByPath !== 'function') {
        return;
      }
      await window.prdDrawer.openDocByPath('1.0.8优化需求.md', '1.0.8 优化需求');
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    }

    lucide.createIcons();
  </script>
</body>
</html>
