<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宋韦兵 · 作品集</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #ffffff;
      color: #111;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 80px 24px 60px;
    }

    /* 个人信息 */
    .me { margin-bottom: 56px; }
    .me h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .me .bio {
      margin-top: 20px;
      color: #444;
      max-width: 520px;
    }

    /* 项目列表 */
    .list { border-top: 1px solid #eee; }
    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 0;
      border-bottom: 1px solid #eee;
      transition: padding 0.15s ease;
    }
    .item:hover { padding-left: 8px; }
    .item .text { min-width: 0; }
    .item .name {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .item .desc {
      color: #888;
      font-size: 13px;
    }
    .item .arrow {
      color: #bbb;
      font-size: 18px;
      line-height: 1;
      transition: color 0.15s ease, transform 0.15s ease;
    }
    .item:hover .arrow {
      color: #111;
      transform: translateX(2px);
    }

    /* 底部 */
    footer {
      margin-top: 56px;
      color: #bbb;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- 个人信息 -->
    <section class="me">
      <h1>宋韦兵 <span style="color:#bbb; font-weight:400;">· Arlen</span></h1>
      <p class="bio">两个原型，均来自小兆老师：一款用于课堂复盘，一款用于绘本创作。</p>
    </section>

    <!-- 原型列表 -->
    <nav class="list">
      <a class="item" href="pages/class-analysis.html" target="_blank" rel="noopener noreferrer">
        <div class="text">
          <div class="name">智能课堂分析</div>
          <div class="desc">上传课堂实录，自动生成多维度分析报告</div>
        </div>
        <span class="arrow">↗</span>
      </a>

      <a class="item" href="https://ai-picbook.netlify.app/" target="_blank" rel="noopener noreferrer">
        <div class="text">
          <div class="name">AI 绘本生成</div>
          <div class="desc">从一句话创意到完整绘本，支持大纲自定义调整</div>
        </div>
        <span class="arrow">↗</span>
      </a>
    </nav>

    <footer>© 2026 Song Weibing · Arlen</footer>
  </div>
</body>
</html>
