<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能教学 - 教务管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://registry.npmmirror.com/lucide/latest/files/dist/umd/lucide.js"></script>
  <script src="components/navbar.js"></script>
  <style>
    .menu-item {
      transition: all 0.2s ease;
      border-left: 3px solid transparent;
    }
    .menu-item:hover {
      background-color: #EFF6FF;
      color: #2563EB;
    }
    .menu-item.active {
      background-color: #DBEAFE;
      color: #2563EB;
      border-left: 3px solid #2563EB;
    }
    .menu-item.active .menu-icon {
      color: #2563EB;
    }
    .class-table th {
      font-weight: 600;
      color: #374151;
      background: #f3f4f6;
    }
    .class-table td {
      vertical-align: middle;
    }
    .class-table tbody tr:nth-child(even) {
      background-color: #fafafa;
    }
    .class-table tbody tr:hover {
      background-color: #f3f4f6;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans flex flex-col h-screen overflow-hidden">

  <!-- 顶部导航栏 -->
  <div id="navbar-container"></div>

  <!-- 主内容区域：左侧菜单 + 右侧内容 -->
  <div class="flex flex-1 overflow-hidden">
    <!-- 左侧菜单（通用） -->
    <aside class="w-56 bg-white border-r border-gray-200 shadow-sm flex-shrink-0 overflow-y-auto">
      <div class="p-4 border-b border-gray-100">
        <h2 class="font-bold text-gray-800 flex items-center gap-2">
          <i data-lucide="layout-dashboard" class="w-5 h-5 text-blue-600"></i>
          教务管理
        </h2>
      </div>
      <nav class="py-2">
        <a href="academic-class.html" class="menu-item active w-full text-left flex items-center gap-3 px-4 py-3 text-sm text-gray-700 cursor-pointer">
          <i data-lucide="school" class="menu-icon w-5 h-5 text-gray-400"></i>
          <span>班级管理</span>
        </a>
        <a href="academic-teacher.html" class="menu-item w-full text-left flex items-center gap-3 px-4 py-3 text-sm text-gray-700 cursor-pointer">
          <i data-lucide="user-cog" class="menu-icon w-5 h-5 text-gray-400"></i>
          <span>老师管理</span>
        </a>
        <a href="academic-package.html" class="menu-item w-full text-left flex items-center gap-3 px-4 py-3 text-sm text-gray-700 cursor-pointer">
          <i data-lucide="landmark" class="menu-icon w-5 h-5 text-gray-400"></i>
          <span>套餐管理</span>
        </a>
        <a href="academic-dashboard.html" class="menu-item w-full text-left flex items-center gap-3 px-4 py-3 text-sm text-gray-700 cursor-pointer">
          <i data-lucide="bar-chart-3" class="menu-icon w-5 h-5 text-gray-400"></i>
          <span>数据看板</span>
        </a>
      </nav>
    </aside>

    <!-- 右侧内容 -->
    <main class="flex-1 p-6 overflow-y-auto">
      <!-- ===================== 班级管理面板 ===================== -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between gap-4">
          <h3 class="font-bold text-gray-800 text-base">班级管理</h3>
          <button type="button" class="inline-flex items-center gap-1 px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors shrink-0">
            <i data-lucide="plus" class="w-4 h-4"></i>
            增加班级
          </button>
        </div>
        <div class="px-5 py-4 border-b border-gray-100 bg-gray-50/90">
          <div class="flex flex-wrap items-center gap-x-6 gap-y-3">
            <div class="flex items-center gap-2">
              <label class="text-sm text-gray-600 whitespace-nowrap">班级状态</label>
              <select class="w-28 px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-700 bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                <option selected>全部</option>
                <option>正常</option>
                <option>已禁用</option>
              </select>
            </div>
            <div class="flex items-center gap-2">
              <label class="text-sm text-gray-600 whitespace-nowrap">班级名称</label>
              <input type="text" placeholder="请输入" class="w-40 px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-700 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" />
            </div>
            <div class="flex items-center gap-2">
              <label class="text-sm text-gray-600 whitespace-nowrap">当前年级</label>
              <select class="w-32 px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-700 bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                <option selected>全部年级</option>
                <option>小学一年级</option>
                <option>初中一年级</option>
                <option>初中三年级</option>
              </select>
            </div>
            <div class="flex items-center gap-2">
              <label class="text-sm text-gray-600 whitespace-nowrap">科任老师</label>
              <input type="text" placeholder="请输入" class="w-40 px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-700 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" />
            </div>
            <button type="button" class="ml-2 px-5 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors">查询</button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="class-table w-full text-sm text-gray-800 border-collapse">
            <thead>
              <tr class="border-b border-gray-200">
                <th class="px-4 py-3 text-center w-20 border-b border-gray-200 whitespace-nowrap">序号</th>
                <th class="px-4 py-3 text-left min-w-[8rem] border-b border-gray-200">班级名称</th>
                <th class="px-4 py-3 text-center min-w-[7rem] border-b border-gray-200">当前年级</th>
                <th class="px-4 py-3 text-left min-w-[14rem] border-b border-gray-200">科任老师</th>
                <th class="px-4 py-3 text-center w-24 border-b border-gray-200">学生人数</th>
                <th class="px-4 py-3 text-center min-w-[8rem] border-b border-gray-200">操作</th>
              </tr>
            </thead>
            <tbody>
              <tr class="border-b border-gray-100"><td class="px-4 py-3 text-center text-gray-600">1</td><td class="px-4 py-3">示例数据班</td><td class="px-4 py-3 text-center">初中一年级</td><td class="px-4 py-3"><div class="space-y-0.5 leading-relaxed"><div>语文 | 2月测试老师 <span class="text-gray-500">(班主任)</span></div></div></td><td class="px-4 py-3 text-center font-medium">6</td><td class="px-4 py-3 text-center"><button type="button" class="text-blue-600 hover:text-blue-800 mr-3 bg-transparent border-0 p-0 cursor-pointer text-sm">编辑</button><button type="button" class="text-blue-600 hover:text-blue-800 bg-transparent border-0 p-0 cursor-pointer text-sm">禁用</button></td></tr>
              <tr class="border-b border-gray-100"><td class="px-4 py-3 text-center text-gray-600">2</td><td class="px-4 py-3">一年级(1)班</td><td class="px-4 py-3 text-center">小学一年级</td><td class="px-4 py-3"><div class="space-y-0.5 leading-relaxed"><div>语文 | 张老师 <span class="text-gray-500">(班主任)</span></div><div>数学 | 李老师</div></div></td><td class="px-4 py-3 text-center font-medium">30</td><td class="px-4 py-3 text-center"><button type="button" class="text-blue-600 hover:text-blue-800 mr-3 bg-transparent border-0 p-0 cursor-pointer text-sm">编辑</button><button type="button" class="text-blue-600 hover:text-blue-800 bg-transparent border-0 p-0 cursor-pointer text-sm">禁用</button></td></tr>
              <tr class="border-b border-gray-100"><td class="px-4 py-3 text-center text-gray-600">3</td><td class="px-4 py-3">一年级(2)班</td><td class="px-4 py-3 text-center">小学一年级</td><td class="px-4 py-3"><div class="space-y-0.5 leading-relaxed"><div>语文 | 王老师 <span class="text-gray-500">(班主任)</span></div></div></td><td class="px-4 py-3 text-center font-medium">28</td><td class="px-4 py-3 text-center"><button type="button" class="text-blue-600 hover:text-blue-800 mr-3 bg-transparent border-0 p-0 cursor-pointer text-sm">编辑</button><button type="button" class="text-blue-600 hover:text-blue-800 bg-transparent border-0 p-0 cursor-pointer text-sm">禁用</button></td></tr>
              <tr class="border-b border-gray-100"><td class="px-4 py-3 text-center text-gray-600">4</td><td class="px-4 py-3"><span>小班</span><span class="ml-2 inline-block px-1.5 py-0.5 text-xs text-red-600 bg-red-50 border border-red-100 rounded">已禁用</span></td><td class="px-4 py-3 text-center">小学一年级</td><td class="px-4 py-3"><div class="space-y-0.5 leading-relaxed"><div>语文 | 王老师 <span class="text-gray-500">(班主任)</span></div></div></td><td class="px-4 py-3 text-center font-medium">5</td><td class="px-4 py-3 text-center"><button type="button" class="text-blue-600 hover:text-blue-800 mr-3 bg-transparent border-0 p-0 cursor-pointer text-sm">编辑</button><button type="button" class="text-blue-600 hover:text-blue-800 bg-transparent border-0 p-0 cursor-pointer text-sm">启用</button></td></tr>
              <tr class="border-b border-gray-100"><td class="px-4 py-3 text-center text-gray-600">5</td><td class="px-4 py-3">初三1班</td><td class="px-4 py-3 text-center">初中三年级</td><td class="px-4 py-3"><div class="space-y-1 leading-relaxed text-gray-800"><div>张老师 <span class="text-gray-500">(班主任)</span> · 语文</div><div>赵老师 · 英语</div><div>孙老师 · 数学</div><div>钱老师 · 物理</div></div></td><td class="px-4 py-3 text-center font-medium">10</td><td class="px-4 py-3 text-center"><button type="button" class="text-blue-600 hover:text-blue-800 mr-3 bg-transparent border-0 p-0 cursor-pointer text-sm">编辑</button><button type="button" class="text-blue-600 hover:text-blue-800 bg-transparent border-0 p-0 cursor-pointer text-sm">禁用</button></td></tr>
              <tr class="border-b border-gray-100"><td class="px-4 py-3 text-center text-gray-600">6</td><td class="px-4 py-3">二年级(3)班</td><td class="px-4 py-3 text-center">小学二年级</td><td class="px-4 py-3"><div class="space-y-0.5 leading-relaxed"><div>语文 | 刘老师 <span class="text-gray-500">(班主任)</span></div><div>英语 | 陈老师</div></div></td><td class="px-4 py-3 text-center font-medium">32</td><td class="px-4 py-3 text-center"><button type="button" class="text-blue-600 hover:text-blue-800 mr-3 bg-transparent border-0 p-0 cursor-pointer text-sm">编辑</button><button type="button" class="text-blue-600 hover:text-blue-800 bg-transparent border-0 p-0 cursor-pointer text-sm">禁用</button></td></tr>
            </tbody>
          </table>
        </div>
        <div class="px-5 py-4 border-t border-gray-100 flex flex-wrap items-center justify-end gap-3">
          <div class="flex items-center gap-1">
            <button type="button" class="w-8 h-8 flex items-center justify-center rounded border border-gray-200 text-gray-500 hover:border-blue-500 hover:text-blue-600 bg-white"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
            <button type="button" class="w-8 h-8 flex items-center justify-center rounded border-2 border-blue-600 text-blue-600 font-medium bg-white text-sm">1</button>
            <button type="button" class="w-8 h-8 flex items-center justify-center rounded border border-gray-200 text-gray-700 hover:border-blue-400 bg-white text-sm">2</button>
            <button type="button" class="w-8 h-8 flex items-center justify-center rounded border border-gray-200 text-gray-700 hover:border-blue-400 bg-white text-sm">3</button>
            <button type="button" class="w-8 h-8 flex items-center justify-center rounded border border-gray-200 text-gray-500 hover:border-blue-500 hover:text-blue-600 bg-white"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
          </div>
          <select class="px-2 py-1.5 border border-gray-200 rounded text-sm text-gray-700 bg-white focus:ring-2 focus:ring-blue-500 outline-none"><option>10条/页</option><option>20条/页</option><option>50条/页</option></select>
          <div class="flex items-center gap-2 text-sm text-gray-600"><span>跳至</span><input type="text" value="1" class="w-10 px-2 py-1 border border-gray-200 rounded text-center text-sm focus:ring-2 focus:ring-blue-500 outline-none" /><span>页</span></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      new Navbar('navbar-container', {
        currentPage: 'academic',
        bodyClass: 'h-screen',
        showTestButton: true,
        showPointsAnimation: true
      });
      lucide.createIcons();
    });
  </script>
</body>
</html>
